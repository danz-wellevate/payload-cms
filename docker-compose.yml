name: payload-cms

services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: payload
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app                  # bind-mount source for hot reload
      - /app/node_modules       # keep the image's node_modules (not the host's)
    env_file: .env
    environment:
      # Forces file-watcher polling so edits on the Windows host trigger HMR
      # inside the Linux container (inotify events don't cross the Docker bridge).
      WATCHPACK_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
